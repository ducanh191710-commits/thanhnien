<!DOCTYPE html>
<html lang="vi">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>THANH NIÊN - Tin tức mỗi ngày</title>

<style>

/* ================= RESET ================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f4f4;
    color: #222;
}


/* ================= HEADER ================= */

.top-header {
    background: #b40000;
    color: white;
}

.header {
    max-width: 1200px;
    height: 82px;
    margin: auto;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 10px;
}

.logo {
    font-size: 34px;
    font-weight: 700;
    letter-spacing: 1px;
}

.logo span {
    display: block;

    margin-top: 3px;

    font-size: 12px;
    font-weight: normal;

    letter-spacing: 0.5px;
}


/* ================= SEARCH ================= */

.search-box {
    display: flex;
}

.search-box input {
    width: 250px;
    height: 40px;

    padding: 0 13px;

    border: none;
    outline: none;

    font-size: 14px;
}

.search-box button {
    width: 55px;
    height: 40px;

    border: none;

    background: #222;
    color: white;

    font-weight: bold;

    cursor: pointer;
}

.search-box button:hover {
    background: #333;
}


/* ================= MENU ================= */

.menu {
    background: white;

    border-bottom: 1px solid #ddd;
}

.menu ul {
    max-width: 1200px;

    margin: auto;

    display: flex;

    list-style: none;

    overflow-x: auto;
}

.menu li {
    padding: 16px 20px;

    font-size: 15px;
    font-weight: bold;

    white-space: nowrap;

    cursor: pointer;
}

.menu li:hover {
    color: #b40000;
}


/* ================= NOTICE ================= */

.warning {
    max-width: 1200px;

    margin: 8px auto;

    padding: 5px;

    text-align: center;

    color: #777;

    font-size: 11px;

    background: #fafafa;

    border: 1px solid #eee;
}


/* ================= MAIN ================= */

.container {
    max-width: 1200px;

    margin: auto;

    padding: 0 10px;
}


/* ================= SECTION TITLE ================= */

.section-title {
    margin: 25px 0 16px;

    padding-left: 12px;

    border-left: 5px solid #b40000;

    font-size: 25px;
}


/* ================= NEWS GRID ================= */

.news-grid {
    display: grid;

    grid-template-columns: repeat(3, 1fr);

    gap: 20px;
}


/* ================= ARTICLE ================= */

.article {
    background: white;

    overflow: hidden;

    border-radius: 5px;

    box-shadow:
        0 2px 8px rgba(0,0,0,0.08);

    cursor: pointer;

    transition: 0.2s;
}

.article:hover {
    transform: translateY(-3px);

    box-shadow:
        0 5px 16px rgba(0,0,0,0.15);
}


/* ================= ARTICLE IMAGE ================= */

.article img {
    width: 100%;
    height: 190px;

    object-fit: cover;

    display: block;
}


/* ================= ARTICLE CONTENT ================= */

.article-content {
    padding: 16px;
}

.category {
    margin-bottom: 8px;

    color: #b40000;

    font-size: 13px;

    font-weight: bold;
}

.article h2 {
    margin-bottom: 9px;

    font-size: 20px;

    line-height: 1.35;
}

.article p {
    color: #666;

    font-size: 15px;

    line-height: 1.55;
}


/* ================= DETAIL ================= */

#detail {
    display: none;

    margin-top: 25px;

    padding: 30px;

    background: white;
}

#detail h1 {
    margin-bottom: 15px;

    font-size: 34px;

    line-height: 1.3;
}

.detail-meta {
    margin-bottom: 20px;

    color: #777;

    font-size: 14px;
}

#detail img {
    width: 100%;
    max-height: 520px;

    object-fit: cover;

    margin-bottom: 20px;
}

.detail-text {
    font-size: 18px;

    line-height: 1.8;
}

.back-button {
    display: inline-block;

    margin-top: 25px;

    padding: 10px 18px;

    background: #b40000;

    color: white;

    border-radius: 3px;

    cursor: pointer;
}

.back-button:hover {
    background: #8f0000;
}


/* ================= FOOTER ================= */

footer {
    margin-top: 50px;

    padding: 28px;

    background: #222;

    color: white;

    text-align: center;
}

footer p {
    margin: 6px;

    font-size: 14px;
}


/* ================= RESPONSIVE ================= */

@media(max-width: 900px) {

    .header {
        padding: 0 15px;
    }

    .news-grid {
        grid-template-columns: repeat(2, 1fr);
    }

}


@media(max-width: 600px) {

    .header {
        height: auto;

        padding: 15px;

        flex-direction: column;

        gap: 15px;
    }

    .logo {
        text-align: center;
    }

    .search-box input {
        width: 200px;
    }

    .container {
        padding: 0 12px;
    }

    .news-grid {
        grid-template-columns: 1fr;
    }

    #detail {
        padding: 20px;
    }

    #detail h1 {
        font-size: 27px;
    }

}

</style>

</head>


<body>


<!-- ================= HEADER ================= -->

<header class="top-header">

    <div class="header">

        <div class="logo">

            THANH NIÊN

            <span>
                TIN TỨC MỖI NGÀY
            </span>

        </div>


        <div class="search-box">

            <input
                id="searchInput"
                type="text"
                placeholder="Tìm kiếm tin tức..."
            >

            <button onclick="searchNews()">
                Tìm
            </button>

        </div>

    </div>

</header>



<!-- ================= MENU ================= -->

<nav class="menu">

    <ul>

        <li onclick="showHome()">
            Trang chủ
        </li>

        <li onclick="filterNews('Thời sự')">
            Thời sự
        </li>

        <li onclick="filterNews('Kinh tế')">
            Kinh tế
        </li>

        <li onclick="filterNews('Công nghệ')">
            Công nghệ
        </li>

        <li onclick="filterNews('Thể thao')">
            Thể thao
        </li>

        <li onclick="filterNews('Đời sống')">
            Đời sống
        </li>

    </ul>

</nav>



<!-- ================= SMALL NOTICE ================= -->

<div class="warning">

    Sản phẩm mô phỏng phục vụ mục đích học tập.

</div>



<!-- ================= MAIN ================= -->

<main class="container">


    <!-- ================= HOME ================= -->

    <section id="home">

        <h1 class="section-title">
            Tin tức mới nhất
        </h1>


        <div
            id="newsGrid"
            class="news-grid">
        </div>

    </section>



    <!-- ================= DETAIL ================= -->

    <section id="detail">

        <h1 id="detailTitle"></h1>


        <div
            id="detailMeta"
            class="detail-meta">
        </div>


        <img
            id="detailImage"
            src=""
            alt="Ảnh bài viết"
        >


        <div
            id="detailText"
            class="detail-text">
        </div>


        <div
            class="back-button"
            onclick="showHome()">

            ← Quay lại trang chủ

        </div>

    </section>


</main>



<!-- ================= FOOTER ================= -->

<footer>

    <p>
        <b>THANH NIÊN</b>
    </p>

    <p>
        Sản phẩm mô phỏng phục vụ mục đích học tập.
    </p>

    <p>
        Không thu thập mật khẩu hoặc thông tin đăng nhập.
    </p>

</footer>



<script>


/* ================= DATA ================= */

const news = [

    {
        title:
        "Ứng dụng công nghệ đang thay đổi cuộc sống như thế nào?",

        category:
        "Công nghệ",

        image:
        "https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=900&q=80",

        description:
        "Công nghệ số đang tạo ra nhiều thay đổi trong học tập, công việc và đời sống.",

        content:
        "Sự phát triển của công nghệ đang tạo ra nhiều thay đổi trong cuộc sống hiện đại. Internet, trí tuệ nhân tạo và các nền tảng số giúp con người tiếp cận thông tin nhanh hơn."
    },


    {
        title:
        "Những xu hướng kinh tế đáng chú ý trong thời gian tới",

        category:
        "Kinh tế",

        image:
        "https://images.unsplash.com/photo-1526304640581-d334cdbbf45e?auto=format&fit=crop&w=900&q=80",

        description:
        "Nhiều lĩnh vực kinh tế đang thay đổi nhanh chóng dưới tác động của công nghệ.",

        content:
        "Kinh tế số đang trở thành một trong những lĩnh vực được quan tâm. Doanh nghiệp ngày càng sử dụng dữ liệu và công nghệ để cải thiện hoạt động."
    },


    {
        title:
        "Các hoạt động thể thao thu hút sự quan tâm của giới trẻ",

        category:
        "Thể thao",

        image:
        "https://images.unsplash.com/photo-1461896836934-ffe607ba8211?auto=format&fit=crop&w=900&q=80",

        description:
        "Thể thao ngày càng trở thành một phần quan trọng trong đời sống của giới trẻ.",

        content:
        "Các hoạt động thể thao giúp nâng cao sức khỏe và tạo cơ hội giao lưu. Nhiều môn thể thao đang được giới trẻ quan tâm và tham gia."
    },


    {
        title:
        "Những thay đổi trong đời sống đô thị hiện đại",

        category:
        "Đời sống",

        image:
        "https://images.unsplash.com/photo-1449824913935-59a10b8d2000?auto=format&fit=crop&w=900&q=80",

        description:
        "Đô thị hiện đại đang thay đổi nhanh chóng cùng với sự phát triển của công nghệ.",

        content:
        "Các thành phố đang áp dụng nhiều giải pháp công nghệ nhằm cải thiện giao thông, môi trường và chất lượng cuộc sống của người dân."
    },


    {
        title:
        "Nâng cao kỹ năng số cho sinh viên",

        category:
        "Thời sự",

        image:
        "https://images.unsplash.com/photo-1523240795612-9a054b0db644?auto=format&fit=crop&w=900&q=80",

        description:
        "Kỹ năng số ngày càng trở thành một phần quan trọng trong quá trình học tập.",

        content:
        "Sinh viên có thể sử dụng nhiều công cụ kỹ thuật số để hỗ trợ học tập và nghiên cứu. Việc hiểu cách sử dụng công nghệ an toàn cũng rất quan trọng."
    },


    {
        title:
        "Trí tuệ nhân tạo mở ra nhiều hướng nghiên cứu mới",

        category:
        "Công nghệ",

        image:
        "https://images.unsplash.com/photo-1677442136019-21780ecad995?auto=format&fit=crop&w=900&q=80",

        description:
        "AI đang được nghiên cứu và ứng dụng trong nhiều lĩnh vực.",

        content:
        "Trí tuệ nhân tạo đang được ứng dụng trong giáo dục, y tế, sản xuất và nhiều lĩnh vực khác. Các công nghệ mới tiếp tục được nghiên cứu và phát triển."
    }

];



/* ================= DISPLAY NEWS ================= */

function displayNews(data) {

    const grid =
        document.getElementById("newsGrid");

    grid.innerHTML = "";


    if(data.length === 0) {

        grid.innerHTML =
            "<p>Không tìm thấy bài viết phù hợp.</p>";

        return;
    }


    data.forEach((article, index) => {

        const div =
            document.createElement("div");

        div.className = "article";


        div.onclick =
            function() {

                openArticle(index, data);

            };


        div.innerHTML = `

            <img
                src="${article.image}"
                alt="${article.title}"
            >

            <div class="article-content">

                <div class="category">
                    ${article.category}
                </div>

                <h2>
                    ${article.title}
                </h2>

                <p>
                    ${article.description}
                </p>

            </div>

        `;


        grid.appendChild(div);

    });

}



/* ================= OPEN ARTICLE ================= */

function openArticle(index, data) {

    const article =
        data[index];


    document.getElementById("home")
        .style.display = "none";


    document.getElementById("detail")
        .style.display = "block";


    document.getElementById("detailTitle")
        .innerText =
        article.title;


    document.getElementById("detailMeta")
        .innerText =
        article.category +
        " | THANH NIÊN";


    document.getElementById("detailImage")
        .src =
        article.image;


    document.getElementById("detailText")
        .innerText =
        article.content;

}



/* ================= HOME ================= */

function showHome() {

    document.getElementById("home")
        .style.display = "block";


    document.getElementById("detail")
        .style.display = "none";

}



/* ================= CATEGORY ================= */

function filterNews(category) {

    const result =
        news.filter(
            article =>
            article.category === category
        );


    showHome();

    displayNews(result);

}



/* ================= SEARCH ================= */

function searchNews() {

    const keyword =
        document.getElementById("searchInput")
        .value
        .toLowerCase()
        .trim();


    if(keyword === "") {

        displayNews(news);

        return;

    }


    const result =
        news.filter(article =>

            article.title
                .toLowerCase()
                .includes(keyword)

            ||

            article.description
                .toLowerCase()
                .includes(keyword)

        );


    showHome();

    displayNews(result);

}



/* ================= ENTER SEARCH ================= */

document
    .getElementById("searchInput")
    .addEventListener(
        "keydown",
        function(event) {

            if(event.key === "Enter") {

                searchNews();

            }

        }
    );



/* ================= INITIAL ================= */

displayNews(news);


</script>

</body>

</html>
